  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(D.s), iterations: D.n, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(D.i)}, key, b64(D.c));
  try { if (recordar) localStorage.setItem(KEY, clave); } catch (x) {}
  document.open(); document.write(new TextDecoder().decode(buf)); document.close();
}
document.getElementById('f').onsubmit = async ev => {
  ev.preventDefault();
  const e = document.getElementById('e'); e.textContent = 'Comprobando…';
  try { await abrir(document.getElementById('p').value, document.getElementById('r').checked); }
  catch (x) { e.textContent = 'Contraseña incorrecta.'; }
};
(async () => {
  try {
    if (location.hash === '#olvidar') { localStorage.removeItem(KEY); document.getElementById('e').textContent = 'Contraseña olvidada en este dispositivo.'; return; }
    const g = localStorage.getItem(KEY);
    if (g) { document.getElementById('e').textContent = 'Entrando…'; await abrir(g, true); }
  } catch (x) { try { localStorage.removeItem(KEY); } catch (y) {} document.getElementById('e').textContent = ''; }
})();
