    if (location.hash === '#olvidar') { localStorage.removeItem(KEY); document.getElementById('e').textContent = 'Contraseña olvidada en este dispositivo.'; return; }
    const g = localStorage.getItem(KEY);
    if (g) { document.getElementById('e').textContent = 'Entrando…'; await abrir(g, true); }
  } catch (x) { try { localStorage.removeItem(KEY); } catch (y) {} document.getElementById('e').textContent = ''; }
})();
</script></body></html>
