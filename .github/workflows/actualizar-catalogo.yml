name: Actualizar catálogo

on:
  schedule:
    - cron: '*/15 * * * *'  # revisa cada 15 min; la ventana+dedupe de abajo
                             # decide si de verdad corresponde actualizar.
                             # GitHub no garantiza el minuto exacto de un cron
                             # (puede demorarse horas en época de carga alta),
                             # así que en vez de pedir una hora exacta se
                             # revisa seguido si ya entramos en la franja.
  workflow_dispatch: {}

jobs:
  check-hora:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      correr: ${{ steps.hora.outputs.correr }}
    steps:
      - id: hora
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Disparo manual — se ejecuta sin importar la hora."
            echo "correr=si" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DIA=$(TZ=Europe/Madrid date +%u)   # 1=lunes … 7=domingo
          if [ "$DIA" = "7" ]; then
            echo "Domingo — no se actualiza ese día."
            echo "correr=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HORA=$(TZ=Europe/Madrid date +%H)
          echo "Hora actual en Madrid: ${HORA}h (día ISO ${DIA})"

          # Revisado el historial real de corridas (gh run list): GitHub
          # dispara este cron cada 2-7h de forma irregular, no cada 15 min
          # como está configurado — con dos franjas angostas (10-12h/16-19h)
          # un salto entre disparos alcanza para dejar AMBAS sin ejecutar el
          # mismo día (pasó el 21/09: disparos a las 8:25, 15:14 y 20:46,
          # ninguno cayó dentro de ninguna franja). Por eso es una sola
          # franja ancha de 9 a 20h: con el peor salto observado (~6h49m)
          # es prácticamente imposible que una franja de 11h quede vacía.
          if [ "$HORA" -lt 9 ] || [ "$HORA" -ge 20 ]; then
            echo "Fuera de la franja 9-20h — se omite."
            echo "correr=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ULTIMO=$(gh api "repos/${{ github.repository }}/commits?per_page=20" \
            --jq '[.[] | select(.commit.message | startswith("Actualización automática del catálogo"))][0].commit.committer.date' \
            2>/dev/null || echo "")

          if [ -n "$ULTIMO" ]; then
            AHORA_EPOCH=$(date -u +%s)
            ULTIMO_EPOCH=$(date -u -d "$ULTIMO" +%s)
            DIFF=$(( AHORA_EPOCH - ULTIMO_EPOCH ))
            if [ "$DIFF" -lt 14400 ]; then
              echo "Ya se actualizó hace menos de 4h (última: $ULTIMO) — se omite para no duplicar."
              echo "correr=no" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "Corresponde actualizar (dentro de franja, sin actualización reciente)."
          echo "correr=si" >> "$GITHUB_OUTPUT"

  actualizar:
    needs: check-hora
    if: needs.check-hora.outputs.correr == 'si'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Hora de Madrid para TODO el job: sin esto `date` y datetime.now() de
    # Python usan UTC (2h menos en verano) — el commit decía 17:02 cuando la
    # web y el correo decían 19:02, y el informe/historial también salían en UTC.
    env:
      TZ: Europe/Madrid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Restaurar caché de fotos
        uses: actions/cache/restore@v4
        with:
          path: fotos
          key: fotos-${{ github.run_id }}
          restore-keys: |
            fotos-

      - name: Preparar config.txt
        run: echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" > config.txt

      - name: Revisar cambios en Das WeltAuto y regenerar PDFs
        run: python3 actualizar_catalogo.py

      - name: Descargar fotos nuevas
        run: python3 descargar_fotos_galeria.py

      - name: Leer fichas técnicas de coches nuevos
        # Solo visita los coches que aún no tienen ficha guardada — si falla,
        # la web se genera igual (esos coches se ven con el formato anterior).
        continue-on-error: true
        run: python3 ficha_tecnica.py

      - name: Descartar fotos archivadas (coches vendidos) antes de cachear
        run: rm -rf fotos/_archivo

      - name: Instalar recortador de fotos (efecto "el coche sale de la tarjeta")
        # Si falla, generar_web.py sigue igual y esos coches no tienen el efecto.
        continue-on-error: true
        run: pip install "rembg[cpu]==2.0.84"

      - name: Caché del modelo de recorte (u2net, ~176 MB)
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-u2net-v1

      - name: Buscar pruebas en vídeo de modelos sin vídeos
        # Coche de un modelo/año sin vídeos en pruebas.json → los busca en
        # YouTube y los añade (y lo apunta en el correo). Si YouTube no
        # responde, la web se genera igual y se reintenta en la próxima corrida.
        continue-on-error: true
        run: python3 buscar_pruebas.py

      - name: Generar la web
        run: python3 generar_web.py

      - name: Guardar caché de fotos actualizado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fotos
          key: fotos-${{ github.run_id }}

      - name: Configurar identidad de git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commitear y subir cambios
        run: |
          git add index.html web_fotos/ coches/ assets/ alejandro/ \
                  historial-precios/ quienes-somos/ comparador.json \
                  datos_coches.json historial_precios.json coches_lista.json \
                  traducciones_cache.json historial_cambios_precio.json \
                  fichas_tecnicas.json recortes.json sitemap.xml robots.txt pruebas.json
          git commit -m "Actualización automática del catálogo $(date '+%d/%m/%Y %H:%M')" || echo "Sin cambios que subir"
          # Si mientras corría esto alguien guardó desde /admin/ (destacados,
          # rebajas), el push se rechaza: se incorpora ese cambio y se reintenta.
          for intento in 1 2 3; do
            git push origin main && exit 0
            echo "Push rechazado (intento $intento) — incorporando cambios remotos…"
            git pull --rebase origin main || { git rebase --abort; exit 1; }
          done
          exit 1

      - name: Preparar resumen para el correo
        id: resumen
        if: success()
        run: |
          python3 - <<'PY'
          import os, uuid
          from pathlib import Path
          # informe_cambios.txt trae el detalle coche por coche (nuevo,
          # vendido, reservado, subida/bajada de precio) — lo mismo que
          # aparece en la página 1 del PDF, pero en texto plano para leer
          # en el correo sin tener que abrirlo.
          ruta = Path("informe_cambios.txt")
          if ruta.exists():
              cuerpo = ruta.read_text(encoding="utf-8")
          else:
              cuerpo = "(no se encontró informe_cambios.txt — revisar el log de esta corrida)"
          # Lanzada a mano (puntito de la web o botón de GitHub): avisarlo
          # arriba del todo, para enterarse si la lanzó otra persona.
          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              cuerpo = ("🖐️ ACTUALIZACIÓN MANUAL — lanzada a mano (puntito de la web "
                        "o botón de GitHub), no por el horario automático.\n\n" + cuerpo)
          # Delimitador aleatorio: si el informe alguna vez contuviera la
          # palabra "EOF" en una línea propia, un delimitador fijo cortaría
          # el cuerpo del correo a la mitad.
          delim = f"EOF_{uuid.uuid4().hex}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"cuerpo<<{delim}\n")
              f.write(cuerpo + "\n")
              f.write(f"{delim}\n")
          PY

      - name: Calcular fecha para el asunto del correo
        id: fecha
        if: success()
        run: echo "fecha=$(TZ=Europe/Madrid date '+%d/%m/%Y %H:%M')" >> "$GITHUB_OUTPUT"

      - name: Enviar correo de éxito
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: andrescovidelpi@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Catálogo Automóviles Rueda <andrescovidelpi@gmail.com>
          to: andrescovidelpi@gmail.com
          subject: "${{ github.event_name == 'workflow_dispatch' && '🖐️ Actualización MANUAL del catálogo' || '✅ Actualización automática del catálogo' }} — ${{ steps.fecha.outputs.fecha }}"
          body: ${{ steps.resumen.outputs.cuerpo }}
          attachments: catalogo_automoviles_rueda_liviano.pdf

      - name: Enviar correo de error
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: andrescovidelpi@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Catálogo Automóviles Rueda <andrescovidelpi@gmail.com>
          to: andrescovidelpi@gmail.com
          subject: "⚠️ Falló la actualización ${{ github.event_name == 'workflow_dispatch' && 'MANUAL' || 'automática' }} del catálogo"
          body: |
            Algo falló durante la actualización ${{ github.event_name == 'workflow_dispatch' && 'MANUAL (lanzada a mano)' || 'automática' }} del catálogo.

            Revisá el detalle acá:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
